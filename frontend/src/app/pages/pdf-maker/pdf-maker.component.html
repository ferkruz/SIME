<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <input
      type="text"
      class="form-control w-50"
      placeholder="Buscar usuario..."
      [(ngModel)]="searchTerm"
    />

    <button class="btn btn-danger" (click)="exportPDF()" [disabled]="filteredUsers.length === 0">
      <i class="bi bi-file-earmark-pdf me-2"></i> Exportar PDF
    </button>
  </div>

  <div *ngIf="searchTerm" class="alert alert-info py-2">
    Se exportarán solo los resultados que coinciden con <strong>"{{ searchTerm }}"</strong>.
  </div>

  <table class="table table-striped table-hover align-middle">
    <thead class="table-primary">
      <tr>
        <th (click)="ordenarPor('id')" style="cursor: pointer">
          ID <i [class]="getIconoOrden('id')"></i>
        </th>
        <th (click)="ordenarPor('nombre')" style="cursor: pointer">
          Nombre <i [class]="getIconoOrden('nombre')"></i>
        </th>
        <th (click)="ordenarPor('email')" style="cursor: pointer">
          Email <i [class]="getIconoOrden('email')"></i>
        </th>
        <th (click)="ordenarPor('rol')" style="cursor: pointer">
          Rol <i [class]="getIconoOrden('rol')"></i>
        </th>
        <th (click)="ordenarPor('estado')" style="cursor: pointer">
          Estado <i [class]="getIconoOrden('estado')"></i>
        </th>
        <th (click)="ordenarPor('fecha')" style="cursor: pointer">
          Fecha <i [class]="getIconoOrden('fecha')"></i>
        </th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let u of paginatedUsers">
        <td>{{ u.id }}</td>
        <td>{{ u.nombre }}</td>
        <td>{{ u.email }}</td>
        <td>{{ u.rol }}</td>
        <td>
          <span class="badge" [ngClass]="{
            'bg-success': u.estado === 'Activo',
            'bg-danger': u.estado === 'Suspendido'
          }">{{ u.estado }}</span>
        </td>
        <td>{{ u.fecha }}</td>
      </tr>
    </tbody>
  </table>

  <nav class="d-flex justify-content-between align-items-center">
    <span>Página {{ paginaActual }} de {{ totalPaginas }}</span>
    <ul class="pagination mb-0">
      <li class="page-item" [class.disabled]="paginaActual === 1">
        <a class="page-link" (click)="cambiarPagina(paginaActual - 1)">Anterior</a>
      </li>
      <li
        class="page-item"
        *ngFor="let p of [].constructor(totalPaginas); let i = index"
        [class.active]="paginaActual === i + 1"
      >
        <a class="page-link" (click)="cambiarPagina(i + 1)">{{ i + 1 }}</a>
      </li>
      <li class="page-item" [class.disabled]="paginaActual === totalPaginas">
        <a class="page-link" (click)="cambiarPagina(paginaActual + 1)">Siguiente</a>
      </li>
    </ul>
  </nav>
</div>
